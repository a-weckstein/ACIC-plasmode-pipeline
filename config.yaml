# =============================================================================
# config.yaml — ACIC 2016 plasmode nuisance-learner simulation study
# (manuscript simulation (2))
#
# One config for the whole pipeline. Scripts 01-04 read it from this directory.
# Settings are addressed by their ACIC id (the identifier aciccomp2016 uses);
# the manuscript's DGP ids 1-44 (Table S2) are carried alongside.
# =============================================================================

# --- Data-generating process (Dorie et al. 2019; aciccomp2016::dgp_2016) ------
dgp:
  n_population: 4802        # fixed real covariate matrix aciccomp2016::input_2016 (4,802 x 58)
  n_sample: 1000            # analysis subsample per replicate, drawn without replacement
  n_sims: 50                # Monte Carlo replicates per DGP setting
  # Seeds (see the header of 01_generate_dgp_data.R): subsample seed
  # "legacy" = sim_id*100 + id, "namespaced" = 500000 + sim_id*1000 + id;
  # fold seed = sim_id*1000 + id.
  subsample_seed_legacy_multiplier: 100
  subsample_seed_namespaced_offset: 500000
  subsample_seed_namespaced_multiplier: 1000
  fold_seed_multiplier: 1000

# --- DGP settings -------------------------------------------------------------
# A setting is a built-in ACIC row (id 1-77, knobs from
# aciccomp2016::parameters_2016; the package seed table allows sims 1-100) or a
# custom knob combination (id >= 100, defined under `custom:` or passed to
# script 01 with --knobs). Knob values:
#   model.trt    linear | polynomial | step | interaction | pure.polynomial
#   root.trt     treatment prevalence in (0, 1)      [competition grid: 0.35, 0.65]
#   overlap.trt  full | one-term | two-term          (one-term = partial overlap)
#   model.rsp    linear | exponential | step | polynomial | interaction | pure.polynomial
#   alignment    0 to 1                              [competition grid: 0, 0.25, 0.75]
#   te.hetero    none | med | high
# seed_scheme for a custom setting: "namespaced" (independent subsample) or
# "legacy", under which custom id 1xx at sim k draws the same rows as built-in
# id - 100 at sim k + 1 (used to pair the full-overlap twins with their
# one-term originals).
settings:

  # --- custom settings ---------------------------------------------------------
  # The manuscript's 11 custom DGPs: 1xx = full-overlap twin of built-in id - 100,
  # 2xx = combinations with no built-in counterpart.
  custom:
    - {id: 101, label: "DGP 01 (custom): full-overlap twin of ACIC 1",   model.trt: linear,     root.trt: 0.35, overlap.trt: full, model.rsp: linear,      alignment: 0.75, te.hetero: high, seed_scheme: legacy}
    - {id: 105, label: "DGP 02 (custom): full-overlap twin of ACIC 5",   model.trt: linear,     root.trt: 0.35, overlap.trt: full, model.rsp: exponential, alignment: 0.75, te.hetero: high, seed_scheme: legacy}
    - {id: 106, label: "DGP 03 (custom): full-overlap twin of ACIC 6",   model.trt: polynomial, root.trt: 0.35, overlap.trt: full, model.rsp: linear,      alignment: 0.75, te.hetero: high, seed_scheme: legacy}
    - {id: 113, label: "DGP 04 (custom): full-overlap twin of ACIC 13",  model.trt: linear,     root.trt: 0.65, overlap.trt: full, model.rsp: exponential, alignment: 0.75, te.hetero: high, seed_scheme: legacy}
    - {id: 103, label: "DGP 33 (custom): full-overlap twin of ACIC 3",   model.trt: linear,     root.trt: 0.35, overlap.trt: full, model.rsp: linear,      alignment: 0.75, te.hetero: none, seed_scheme: legacy}
    - {id: 102, label: "DGP 34 (custom): full-overlap twin of ACIC 2",   model.trt: polynomial, root.trt: 0.35, overlap.trt: full, model.rsp: exponential, alignment: 0.75, te.hetero: none, seed_scheme: legacy}
    - {id: 204, label: "DGP 05 (custom): linear PS / step outcome",      model.trt: linear,     root.trt: 0.35, overlap.trt: full, model.rsp: step,        alignment: 0.75, te.hetero: high, seed_scheme: namespaced}
    - {id: 205, label: "DGP 06 (custom): step PS / linear outcome",      model.trt: step,       root.trt: 0.35, overlap.trt: full, model.rsp: linear,      alignment: 0.75, te.hetero: high, seed_scheme: namespaced}
    - {id: 206, label: "DGP 07 (custom): linear PS / step outcome, low alignment",  model.trt: linear, root.trt: 0.35, overlap.trt: full, model.rsp: step,   alignment: 0.25, te.hetero: med,  seed_scheme: namespaced}
    - {id: 207, label: "DGP 08 (custom): step PS / linear outcome, low alignment",  model.trt: step,   root.trt: 0.35, overlap.trt: full, model.rsp: linear, alignment: 0.25, te.hetero: med,  seed_scheme: namespaced}
    - {id: 203, label: "DGP 35 (custom): step PS / exponential outcome, no heterogeneity", model.trt: step, root.trt: 0.35, overlap.trt: full, model.rsp: exponential, alignment: 0.75, te.hetero: none, seed_scheme: namespaced}

  # --- labels for built-in settings (manuscript Table S2 numbers; optional) -----
  labels:
    4:  "DGP 09 (ACIC 4)"
    28: "DGP 10 (ACIC 28)"
    29: "DGP 11 (ACIC 29)"
    30: "DGP 12 (ACIC 30)"
    32: "DGP 13 (ACIC 32)"
    33: "DGP 14 (ACIC 33)"
    41: "DGP 15 (ACIC 41)"
    42: "DGP 16 (ACIC 42)"
    43: "DGP 17 (ACIC 43)"
    45: "DGP 18 (ACIC 45)"
    46: "DGP 19 (ACIC 46)"
    47: "DGP 20 (ACIC 47)"
    56: "DGP 21 (ACIC 56)"
    57: "DGP 22 (ACIC 57)"
    58: "DGP 23 (ACIC 58)"
    60: "DGP 24 (ACIC 60)"
    61: "DGP 25 (ACIC 61)"
    62: "DGP 26 (ACIC 62)"
    71: "DGP 27 (ACIC 71)"
    72: "DGP 28 (ACIC 72)"
    73: "DGP 29 (ACIC 73)"
    75: "DGP 30 (ACIC 75)"
    76: "DGP 31 (ACIC 76)"
    77: "DGP 32 (ACIC 77)"
    2:  "DGP 36 (ACIC 2)"
    3:  "DGP 37 (ACIC 3)"
    5:  "DGP 38 (ACIC 5)"
    6:  "DGP 39 (ACIC 6)"
    7:  "DGP 40 (ACIC 7)"
    8:  "DGP 41 (ACIC 8)"
    9:  "DGP 42 (ACIC 9)"
    24: "DGP 43 (ACIC 24)"
    54: "DGP 44 (ACIC 54)"

  # --- presets (`--settings <name>`; names and ids can be mixed) -----------------
  presets:
    # the manuscript's 44 DGPs in Table S2 order
    manuscript: [101, 105, 106, 113, 204, 205, 206, 207,
                 4, 28, 29, 30, 32, 33, 41, 42, 43, 45, 46, 47,
                 56, 57, 58, 60, 61, 62, 71, 72, 73, 75, 76, 77,
                 103, 102, 203,
                 2, 3, 5, 6, 7, 8, 9, 24, 54]
    # the 35 full-overlap DGPs (ATE and CATE are identified only here)
    manuscript_full_overlap: [101, 105, 106, 113, 204, 205, 206, 207,
                              4, 28, 29, 30, 32, 33, 41, 42, 43, 45, 46, 47,
                              56, 57, 58, 60, 61, 62, 71, 72, 73, 75, 76, 77,
                              103, 102, 203]
    # the 9 one-term (partial overlap) DGPs; the ATT is still identified
    manuscript_one_term: [2, 3, 5, 6, 7, 8, 9, 24, 54]
    # two settings for smoke tests
    demo: [4, 24]

# --- Estimation settings ------------------------------------------------------
estimation:
  pi_bounds: [0.025, 0.975]        # propensity truncation, applied to every learner before any estimator
  k_folds: 5                       # cross-fitting folds (shared across learners within a sim)
  cross_fit_options: [false, true]
  # The estimators (TMLE, AIPW, Hajek IPW, G-computation, each for the ATE and
  # the ATT) are fixed in 03_run_ate_estimators.R.

# --- Nuisance learners (key: manuscript name) -----------------------------------
#   parametric "Parametric" (ATE/ATT), parametric_strat "Parametric" (CATE),
#   ranger_naimi "Random Forest", sl_naimi_v1_adapt "SL Naimi",
#   sl_balzer_screened "SL Balzer", sl_default_screened "SL Default",
#   hal_s1_d2_acic "HAL", oracle (true nuisances, no cross-fit arm).
#   TabPFN v3 is described in the README and is not part of this code.
learners:
  - parametric
  - parametric_strat
  - ranger_naimi
  - sl_naimi_v1_adapt
  - sl_balzer_screened
  - sl_default_screened
  - hal_s1_d2_acic
  - oracle

# --- Evaluation (script 04) ---------------------------------------------------
evaluation:
  # ATE and CATE on full-overlap settings only; ATT on all; PEHE cross-fit only
  ate_settings: full_overlap
  att_settings: all
  pehe_settings: full_overlap
  pehe_cross_fit_only: true

# --- Paths (relative to this directory) --------------------------------------
paths:
  data_inputs: _data_inputs        # per-(setting, sim) dataset cache
  data_processed: _data_processed  # nuisance fits: <setting>/<learner>/...; optional CSV export
  results: results
