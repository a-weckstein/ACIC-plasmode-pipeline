# =============================================================================
# config.yaml — ACIC 2016 plasmode nuisance-learner simulation study
# (manuscript simulation (2))
#
# One config for the whole pipeline. Scripts 01-04 read it from this directory.
# Settings are addressed by their ACIC id (the identifier aciccomp2016 uses);
# the manuscript's DGP ids 1-44 (Table S2) are carried alongside.
# =============================================================================

# --- Data-generating process (Dorie et al. 2019; aciccomp2016::dgp_2016) ------
dgp:
  n_population: 4802        # fixed real covariate matrix aciccomp2016::input_2016 (4,802 x 58)
  n_sample: 1000            # analysis subsample per replicate, drawn without replacement
  n_sims: 50                # Monte Carlo replicates per DGP setting
  # Seed protocol -- every random draw is deterministic in (acic_id, sim_id), so
  # every learner sees the IDENTICAL dataset and folds (paired comparisons):
  #   surfaces, A, Y : dgp_2016(x, acic_id, sim_id) for numbered ACIC settings
  #                    (the package's curated seed table); custom settings pass
  #                    their knob list with sim_id as the seed
  #   n=1000 subsample : set.seed(subsample_seed) right after dgp_2016();
  #                    "legacy"     = sim_id*100 + acic_id
  #                    "namespaced" = 500000 + sim_id*1000 + acic_id
  #   cross-fit folds : set.seed(sim_id*1000 + acic_id)
  # NOTE dgp_2016() switches R's sampler to sample.kind = "Rounding" for the
  # session; scripts 01 and 02 rely on that (see their headers).
  subsample_seed_legacy_multiplier: 100
  subsample_seed_namespaced_offset: 500000
  subsample_seed_namespaced_multiplier: 1000
  fold_seed_multiplier: 1000

# --- The 44 DGP settings (manuscript Table S2) ---------------------------------
# columns: manuscript DGP id; ACIC id; the six dgp_2016 knobs; subsample-seed
# scheme. Numbered ACIC ids (<= 77) are rows of aciccomp2016::parameters_2016
# (knobs listed here are cross-checked against the package at load time).
# ACIC ids >= 100 are CUSTOM settings built with the same machinery:
#   1xx = full-overlap twins of the one-term setting (id - 100), "legacy" seed
#         (so (1xx, sim k) draws the same subsample rows as (id-100, sim k+1));
#   2xx = knob combinations with no numbered analog, "namespaced" seed.
settings:
  columns: [dgp_id, acic_id, model.trt, root.trt, overlap.trt, model.rsp, alignment, te.hetero, seed_scheme]
  rows:
    - [ 1, 101, linear,     0.35, full,     linear,      0.75, high, legacy]
    - [ 2, 105, linear,     0.35, full,     exponential, 0.75, high, legacy]
    - [ 3, 106, polynomial, 0.35, full,     linear,      0.75, high, legacy]
    - [ 4, 113, linear,     0.65, full,     exponential, 0.75, high, legacy]
    - [ 5, 204, linear,     0.35, full,     step,        0.75, high, namespaced]
    - [ 6, 205, step,       0.35, full,     linear,      0.75, high, namespaced]
    - [ 7, 206, linear,     0.35, full,     step,        0.25, med,  namespaced]
    - [ 8, 207, step,       0.35, full,     linear,      0.25, med,  namespaced]
    - [ 9,   4, polynomial, 0.35, full,     exponential, 0.75, high, legacy]
    - [10,  28, polynomial, 0.35, full,     step,        0.25, high, legacy]
    - [11,  29, polynomial, 0.35, full,     step,        0.75, med,  legacy]
    - [12,  30, polynomial, 0.35, full,     step,        0.75, high, legacy]
    - [13,  32, polynomial, 0.35, full,     exponential, 0.25, high, legacy]
    - [14,  33, polynomial, 0.35, full,     exponential, 0.75, med,  legacy]
    - [15,  41, polynomial, 0.65, full,     step,        0.25, high, legacy]
    - [16,  42, polynomial, 0.65, full,     step,        0.75, med,  legacy]
    - [17,  43, polynomial, 0.65, full,     step,        0.75, high, legacy]
    - [18,  45, polynomial, 0.65, full,     exponential, 0.25, high, legacy]
    - [19,  46, polynomial, 0.65, full,     exponential, 0.75, med,  legacy]
    - [20,  47, polynomial, 0.65, full,     exponential, 0.75, high, legacy]
    - [21,  56, step,       0.35, full,     step,        0.25, high, legacy]
    - [22,  57, step,       0.35, full,     step,        0.75, med,  legacy]
    - [23,  58, step,       0.35, full,     step,        0.75, high, legacy]
    - [24,  60, step,       0.35, full,     exponential, 0.25, high, legacy]
    - [25,  61, step,       0.35, full,     exponential, 0.75, med,  legacy]
